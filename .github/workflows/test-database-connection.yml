name: PostgreSQL接続テスト

# ============================================================
# 実行条件
# ============================================================

on:
  # GitHub Actions画面からの手動実行専用です。
  workflow_dispatch:


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: test-database-connection
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  test-database-connection:
    name: Supabase PostgreSQL接続確認
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v4

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # PostgreSQL接続テスト
      # ======================================================

      - name: Supabase PostgreSQLへ接続
        run: |
          python src/test_database_connection.py
