name: 東証上場銘柄一覧の更新

# ============================================================
# 実行条件
# ============================================================

on:
  # GitHub Actions画面から手動実行できます。
  workflow_dispatch:

  # JPXの月末銘柄一覧が更新された後に実行します。
  # UTC 10:00 = 日本時間 19:00
  schedule:
    - cron: "0 10 5 * *"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: update-listed-stocks
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  update-listed-stocks:
    name: 銘柄マスター更新
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

      GOOGLE_SERVICE_ACCOUNT_JSON: >-
        ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GOOGLE_SPREADSHEET_ID: >-
        ${{ secrets.GOOGLE_SPREADSHEET_ID }}

      DISCORD_WEBHOOK_URL: >-
        ${{ secrets.DISCORD_WEBHOOK_URL }}


    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 実行
      # ======================================================

      - name: 東証上場銘柄一覧を更新
        run: |
          python src/update_listed_stocks.py
