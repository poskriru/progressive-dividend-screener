name: データ整合性チェック

# ============================================================
# 実行条件
# ============================================================

on:
  # GitHub Actions画面から手動実行できます。
  workflow_dispatch:

  # 毎日日本時間10時に実行します。
  # Discord候補検索キャッシュ更新（0時30分）と
  # 前日の株価更新（19時30分）の後に整合を確認します。
  # GitHub ActionsのcronはUTCです。
  # UTC 1:00 = 日本時間 10:00
  schedule:
    - cron: "0 1 * * *"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: run-data-health-check
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  run-data-health-check:
    name: データ整合性チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

      DISCORD_WEBHOOK_URL: >-
        ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # データ整合性チェック
      # ======================================================

      - name: データ整合性チェックを実行
        run: |
          python src/run_data_health_check.py