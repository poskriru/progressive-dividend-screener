name: TDnet配当関連開示の更新

# ============================================================
# 実行条件
# ============================================================

on:
  # 初回の実データ検証中は手動実行だけに限定します。
  workflow_dispatch:
    inputs:
      lookback_days:
        description: TDnet一覧を遡る日数
        required: true
        default: "7"
        type: choice
        options:
          - "1"
          - "3"
          - "7"
          - "14"
          - "31"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: update-tdnet-dividend-disclosures
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  update-tdnet-dividend-disclosures:
    name: TDnet配当開示・PDF本文解析
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

      GOOGLE_SERVICE_ACCOUNT_JSON: >-
        ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GOOGLE_SPREADSHEET_ID: >-
        ${{ secrets.GOOGLE_SPREADSHEET_ID }}

      DISCORD_WEBHOOK_URL: >-
        ${{ secrets.DISCORD_WEBHOOK_URL }}

      TDNET_LOOKBACK_DAYS: >-
        ${{ inputs.lookback_days }}


    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7


      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip


      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # 実行前検証
      # ======================================================

      - name: 必須Secretを確認
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URLが設定されていません。"
            exit 1
          fi

          if [ -z "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSONが設定されていません。"
            exit 1
          fi

          if [ -z "${GOOGLE_SPREADSHEET_ID:-}" ]; then
            echo "GOOGLE_SPREADSHEET_IDが設定されていません。"
            exit 1
          fi

          echo "必須Secretが設定されています。"
          echo "TDnet取得日数: ${TDNET_LOOKBACK_DAYS}"


      # ======================================================
      # TDnet更新・PDF本文解析
      # ======================================================

      - name: TDnet配当関連開示を更新
        run: |
          python src/update_tdnet_dividend_disclosures.py
