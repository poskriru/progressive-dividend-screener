name: JPX株式分割・併合情報の更新

# ============================================================
# 実行条件
# ============================================================

on:
  # 初回バックフィルを安全に分割実行できるよう、
  # 現段階では手動実行だけにする。
  workflow_dispatch:
    inputs:
      coverage_start:
        description: "取得開始月（YYYY-MM）"
        required: true
        type: string
        default: "2022-01"

      coverage_end:
        description: "取得終了月（YYYY-MM）"
        required: true
        type: string
        default: "2022-01"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: update-jpx-corporate-actions
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  update-jpx-corporate-actions:
    name: JPX調整係数更新
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

      JPX_COVERAGE_START: >-
        ${{ github.event.inputs.coverage_start }}

      JPX_COVERAGE_END: >-
        ${{ github.event.inputs.coverage_end }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 事前検証
      # ======================================================

      - name: Python構文を確認
        run: |
          python -m compileall -q src tests

      - name: JPX単体テストを実行
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_jpx_corporate_actions.py" \
            -v

      # ======================================================
      # PostgreSQLマイグレーション
      # ======================================================

      - name: PostgreSQLマイグレーションを実行
        run: |
          python src/run_database_migrations.py

      # ======================================================
      # JPX月次企業行動取得
      # ======================================================

      - name: JPX株式分割・株式併合情報を更新
        run: |
          echo "取得期間: ${JPX_COVERAGE_START} ～ ${JPX_COVERAGE_END}"
          python src/update_jpx_corporate_actions.py
