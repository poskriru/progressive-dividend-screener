name: Python構文チェック

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - ".github/workflows/python-syntax-check.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-syntax-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Python構文チェック
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ======================================================
      # ソースコード取得
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ======================================================
      # Python環境
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ======================================================
      # src配下のPython構文チェック
      #
      # 外部API、データベース、Google Sheetsには接続しない。
      # ======================================================
      - name: Compile Python source files
        run: |
          python -m compileall -q src
