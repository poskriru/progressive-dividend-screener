name: Python構文チェック

on:
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-syntax-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Python構文チェック
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: screener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ======================================================
      # ソースコード取得
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ======================================================
      # Python環境
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # Python構文チェック
      # ======================================================
      - name: Compile Python source files
        run: |
          python -m compileall -q src tests

      # ======================================================
      # 単体テスト
      # ======================================================
      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/screener_test
        run: |
          python -m unittest discover -s tests -v
