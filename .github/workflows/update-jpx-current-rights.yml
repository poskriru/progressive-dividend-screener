name: JPX当月権利処理候補の更新

# ============================================================
# 実行条件
# ============================================================

on:
  # 平日の18時17分に当月ページを再取得する。
  schedule:
    - cron: "17 9 * * 1-5"
      timezone: "Asia/Tokyo"

  workflow_dispatch:


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: update-jpx-current-rights
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  update-jpx-current-rights:
    name: JPX当月権利処理候補更新
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 事前検証
      # ======================================================

      - name: Python構文を確認
        run: |
          python -m compileall -q src tests

      - name: JPX当月権利処理の単体テストを実行
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_jpx_current_rights.py" \
            -v

      # ======================================================
      # PostgreSQLマイグレーション
      # ======================================================

      - name: PostgreSQLマイグレーションを実行
        run: |
          python src/run_database_migrations.py

      # ======================================================
      # JPX当月権利処理候補
      # ======================================================

      - name: JPX当月権利処理候補を更新
        run: |
          python src/update_jpx_current_rights.py
