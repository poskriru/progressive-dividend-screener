name: 最新株価の更新

# ============================================================
# 実行条件
# ============================================================

on:
  # GitHub Actions画面から手動実行できます。
  workflow_dispatch:

  # 月曜日から金曜日の日本時間19時30分に実行します。
  # GitHub ActionsのcronはUTCです。
  # UTC 10:30 = 日本時間 19:30
  schedule:
    - cron: "30 10 * * 1-5"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: update-stock-prices
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  update-stock-prices:
    name: 最新株価更新
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo

      GOOGLE_SERVICE_ACCOUNT_JSON: >-
        ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GOOGLE_SPREADSHEET_ID: >-
        ${{ secrets.GOOGLE_SPREADSHEET_ID }}

      DISCORD_WEBHOOK_URL: >-
        ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v4

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 最新株価更新
      # ======================================================

      - name: JPX日報から最新株価を更新
        run: |
          python src/update_stock_prices.py
