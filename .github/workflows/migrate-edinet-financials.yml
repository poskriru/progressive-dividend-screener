name: 既存EDINET財務のDB移行

# ============================================================
# 実行条件
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: migrate-edinet-financials
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  migrate-edinet-financials:
    name: 既存EDINET財務DB移行
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

      GOOGLE_SERVICE_ACCOUNT_JSON: >-
        ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GOOGLE_SPREADSHEET_ID: >-
        ${{ secrets.GOOGLE_SPREADSHEET_ID }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # 既存財務データ移行
      # ======================================================

      - name: EDINET財務をPostgreSQLへ移行
        run: |
          python src/migrate_edinet_financials.py
