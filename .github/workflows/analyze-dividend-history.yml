name: 年間配当履歴の診断

# ============================================================
# 実行条件
# ============================================================

on:
  # GitHub Actions画面から手動実行できます。
  workflow_dispatch:

  # 毎週日曜日の日本時間9時に実行します。
  # GitHub ActionsのcronはUTCです。
  # UTC 0:00 = 日本時間 9:00
  schedule:
    - cron: "0 0 * * 0"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: analyze-dividend-history
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  analyze-dividend-history:
    name: 年間配当履歴を診断
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Tokyo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # Python構文チェック
      # ======================================================

      - name: Python構文を確認
        run: |
          python -m compileall -q src

      # ======================================================
      # 年間配当履歴の診断
      # ======================================================

      - name: 年間配当履歴を診断
        run: |
          python src/analyze_dividend_history.py
