name: Discord候補検索キャッシュ更新

# ============================================================
# 実行条件
# ============================================================

on:
  workflow_dispatch:

  # 毎日、日本時間0時30分に更新します。
  # UTC 15:30 = 日本時間0時30分
  schedule:
    - cron: "30 15 * * *"


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: refresh-discord-candidate-search-cache
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  refresh-discord-candidate-search-cache:
    name: Discord候補検索キャッシュ更新
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Tokyo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Python環境
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lambda/worker-requirements.txt

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/worker-requirements.txt

      # ======================================================
      # キャッシュ更新
      # ======================================================

      - name: Discord候補検索キャッシュを更新
        run: |
          python src/refresh_discord_candidate_search_cache.py
