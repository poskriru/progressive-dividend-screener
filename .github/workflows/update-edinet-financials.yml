name: EDINET財務情報の更新

on:
  workflow_dispatch:
    inputs:
      max_documents:
        description: "1回に処理する最大書類数"
        required: true
        default: "100"

  schedule:
    # 毎日 00:30 JST
    - cron: "30 15 * * *"

permissions:
  contents: read

concurrency:
  group: update-edinet-financials
  cancel-in-progress: false

jobs:
  update-edinet-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Tokyo
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      MAX_DOCUMENTS: ${{ github.event.inputs.max_documents || '30' }}

    steps:
      # ======================================================
      # ソースコード取得
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # Python環境
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # EDINET財務情報取得
      # ======================================================
      - name: Update EDINET financials
        run: |
          python src/update_edinet_financials.py
