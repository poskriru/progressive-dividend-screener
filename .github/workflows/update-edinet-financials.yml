name: EDINET財務情報の更新

on:
  workflow_dispatch:
    inputs:
      max_documents:
        description: "1回に処理する最大書類数"
        required: true
        default: "500"

      force_doc_ids:
        description: "強制再処理するdoc_id（カンマ区切り、通常実行時は空欄）"
        required: false
        default: ""

  # ==========================================================
  # 5年分財務情報バックフィル中の一時スケジュール
  # UTC基準で4時間ごとに実行
  # ==========================================================
  schedule:
    - cron: "30 0,4,8,12,16,20 * * *"

permissions:
  contents: read

concurrency:
  group: update-edinet-financials
  cancel-in-progress: false

jobs:
  update-edinet-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}

      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}

      MAX_DOCUMENTS: ${{ github.event.inputs.max_documents || '500' }}

      FORCE_DOC_IDS: ${{ github.event.inputs.force_doc_ids || '' }}

    steps:
      # ======================================================
      # ソースコード取得
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # ======================================================
      # Python環境
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # EDINET財務情報取得
      # ======================================================
      - name: Update EDINET financials
        run: |
          echo "MAX_DOCUMENTS=${MAX_DOCUMENTS}"
          echo "FORCE_DOC_IDS=${FORCE_DOC_IDS}"
          python src/update_edinet_financials.py

      # ======================================================
      # PostgreSQL版株式指標を本番シートへ出力
      # ======================================================
      - name: Export database indicators to production sheet
        env:
          INDICATOR_OUTPUT_SHEET_NAME: 株式指標
        run: |
          python src/export_database_indicators.py
