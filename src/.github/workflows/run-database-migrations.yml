name: PostgreSQLマイグレーション

# ============================================================
# 実行条件
# ============================================================

on:
  # 意図しないスキーマ変更を避けるため、
  # 現段階では手動実行だけにします。
  workflow_dispatch:


# ============================================================
# 権限
# ============================================================

permissions:
  contents: read


# ============================================================
# 同時実行制御
# ============================================================

concurrency:
  group: database-migrations
  cancel-in-progress: false


# ============================================================
# ジョブ
# ============================================================

jobs:
  run-database-migrations:
    name: Supabase PostgreSQLスキーマ更新
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Tokyo

      DATABASE_URL: >-
        ${{ secrets.DATABASE_URL }}

    steps:
      # ======================================================
      # リポジトリ取得
      # ======================================================

      - name: リポジトリを取得
        uses: actions/checkout@v7

      # ======================================================
      # Pythonセットアップ
      # ======================================================

      - name: Pythonをセットアップ
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # ======================================================
      # 依存パッケージ
      # ======================================================

      - name: Pythonパッケージをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # データベースマイグレーション
      # ======================================================

      - name: PostgreSQLマイグレーションを実行
        run: |
          python src/run_database_migrations.py
